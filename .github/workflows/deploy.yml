name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate frontend runtime contracts
        run: npm run validate:frontend-runtime-contracts
      - name: Validate deployment readiness
        run: npm run validate:deployment-readiness
      - name: Build production frontend
        run: npm run build
      - name: Validate dist output
        run: test -f dist/index.html && test -d dist/assets
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 30

  smoke-test:
    name: Artifact Smoke Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/
      - name: Check critical files
        run: test -s dist/index.html && find dist/assets -type f -name '*.js' | grep -q .

  deploy-vercel:
    name: Deploy to Vercel
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Vercel token
        id: vercel
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; echo "::warning::VERCEL_TOKEN is not configured; Vercel CLI deployment is skipped. Configure it to enable this workflow's CLI deployment."; fi
      - name: Setup Node.js
        if: steps.vercel.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'
      - name: Install Vercel CLI
        if: steps.vercel.outputs.configured == 'true'
        run: npm install -g vercel
      - name: Pull Vercel project
        if: steps.vercel.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build with Vercel
        if: steps.vercel.outputs.configured == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy production artifact
        if: steps.vercel.outputs.configured == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Verify deployed production
        if: steps.vercel.outputs.configured == 'true' && env.DEPLOYMENT_URL != ''
        run: npm run verify:production
        env:
          DEPLOYMENT_URL: ${{ secrets.DEPLOYMENT_URL }}
