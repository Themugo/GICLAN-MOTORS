name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_available: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Validate dist output
        run: |
          test -f dist/index.html || { echo "ERROR: dist/index.html not found"; exit 1; }
          test -d dist/assets || { echo "ERROR: dist/assets not found"; exit 1; }
          echo "Build output validated"

      - name: Upload deployment artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 30

  smoke-test:
    name: Build Artifact Smoke Test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: needs.validate.result == 'success' && needs.validate.outputs.build_available == 'true'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist/

      - name: Check critical files
        run: |
          echo "Checking critical files..."
          ls -la dist/
          ls -la dist/assets/
          grep -l "react" dist/assets/*.js || true
          echo "Critical file check passed"

  deploy-vercel:
    name: Deploy and Verify Production
    needs: validate
    if: needs.validate.outputs.build_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Vercel production credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ERROR: VERCEL_TOKEN is not configured. Production deployment cannot be certified." >&2
            echo "Set VERCEL_TOKEN under Settings > Secrets and variables > Actions before pushing to main." >&2
            exit 1
          fi
          echo "Vercel production credentials detected."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@54.17.2

      - name: Report Vercel CLI version
        run: vercel --version

      - name: Pull Vercel production project information
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "ERROR: Vercel returned an empty deployment URL." >&2
            exit 1
          fi
          case "$DEPLOYMENT_URL" in
            https://*) ;;
            *) echo "ERROR: unexpected deployment URL: $DEPLOYMENT_URL" >&2; exit 1 ;;
          esac
          echo "Deployment URL: $DEPLOYMENT_URL"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify deployment and public production health
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          PUBLIC_URL: https://kayad.space
          API_URL: https://api.kayad.space
        run: npm run verify:production

      - name: Record production certification
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          {
            echo "## Production Deployment Certification"
            echo ""
            echo "- Commit: \\`${GITHUB_SHA}\\`"
            echo "- Vercel deployment: ${DEPLOYMENT_URL}"
            echo "- Public domain: https://kayad.space"
            echo "- API health: https://api.kayad.space/health"
            echo "- Result: PASSED"
          } >> "$GITHUB_STEP_SUMMARY"
